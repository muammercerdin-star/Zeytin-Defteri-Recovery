plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// Supabase istemci ayarları repoda tutulmaz. Proje kökündeki local.properties (git'e gitmez)
// ya da aynı adlı ortam değişkenlerinden okunur ve BuildConfig'e yazılır (bkz. MarketBackendConfig).
//   SUPABASE_URL=https://<proje>.supabase.co
//   SUPABASE_PUBLISHABLE_KEY=sb_publishable_...
// Yoksa boş yazılır; uygulama Supabase'i "yapılandırılmadı" sayar ve istek göndermez.
def zdLocalProperties = new Properties()
def zdLocalFile = rootProject.file('local.properties')
if (zdLocalFile.exists()) {
    zdLocalFile.withInputStream { zdLocalProperties.load(it) }
}
def zdBuildString = { String name ->
    def value = (zdLocalProperties.getProperty(name) ?: System.getenv(name) ?: '').trim()
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// Play yayın imzası (upload key). Anahtar ve şifreler ASLA repoya girmez; yalnız telefondaki
// ~/.gradle/gradle.properties dosyasından okunur:
//   ZEYTIN_UPLOAD_STORE_FILE=~/zeytin-anahtar/zeytin-upload.jks
//   ZEYTIN_UPLOAD_STORE_PASSWORD=...
//   ZEYTIN_UPLOAD_KEY_ALIAS=zeytin-upload
//   ZEYTIN_UPLOAD_KEY_PASSWORD=...
// Ayar yoksa debug derlemesi normal çalışır; yalnız bundleRelease/assembleRelease durdurulur.
def zdUploadProperty = { String name ->
    def value = project.findProperty(name)
    return value == null ? '' : value.toString().trim()
}
def zdUploadStorePath = zdUploadProperty('ZEYTIN_UPLOAD_STORE_FILE')
if (zdUploadStorePath.startsWith('~/')) {
    zdUploadStorePath = System.getProperty('user.home') + zdUploadStorePath.substring(1)
}
def zdHasUploadKey = !zdUploadStorePath.isEmpty() && new File(zdUploadStorePath).isFile() &&
        ['ZEYTIN_UPLOAD_STORE_PASSWORD', 'ZEYTIN_UPLOAD_KEY_ALIAS', 'ZEYTIN_UPLOAD_KEY_PASSWORD']
                .every { !zdUploadProperty(it).isEmpty() }

android {
    namespace 'com.zeytindefteri.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zeytindefteri.app'
        minSdk 24
        targetSdk 36
        // Her Play yüklemesinde versionCode BİR artar (1, 2, 3…). Zorunlu güncelleme bu sayıya bakar:
        // hosting'deki zeytin-defteri/app-config.json -> min_version / latest_version.
        versionCode 4
        versionName '1.0.3'

        buildConfigField 'String', 'SUPABASE_URL', zdBuildString('SUPABASE_URL')
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', zdBuildString('SUPABASE_PUBLISHABLE_KEY')
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (zdHasUploadKey) {
            upload {
                storeFile file(zdUploadStorePath)
                storePassword zdUploadProperty('ZEYTIN_UPLOAD_STORE_PASSWORD')
                keyAlias zdUploadProperty('ZEYTIN_UPLOAD_KEY_ALIAS')
                keyPassword zdUploadProperty('ZEYTIN_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            if (zdHasUploadKey) {
                signingConfig signingConfigs.upload
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// İmzasız bir paketin yanlışlıkla Play'e hazırlanmasını önler.
tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }.configureEach {
    doFirst {
        if (!zdHasUploadKey) {
            throw new GradleException(
                    'Yayın imzası bulunamadı. ~/.gradle/gradle.properties içinde ZEYTIN_UPLOAD_STORE_FILE, ' +
                    'ZEYTIN_UPLOAD_STORE_PASSWORD, ZEYTIN_UPLOAD_KEY_ALIAS ve ZEYTIN_UPLOAD_KEY_PASSWORD ' +
                    'tanımlı olmalı ve anahtar dosyası mevcut olmalı.')
        }
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    implementation 'com.google.firebase:firebase-auth:24.2.0'
    implementation 'com.google.firebase:firebase-firestore:26.0.1'
    implementation 'com.google.firebase:firebase-storage:21.0.1'
    // Çökme raporları: Firebase Crashlytics (ücretsiz planda da ücretsiz).
    implementation 'com.google.firebase:firebase-crashlytics:20.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Tezgah QR fişi: QR çizimi (ZXing, saf Java) ve okutma (Google Code Scanner; kamera izni gerektirmez).
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
