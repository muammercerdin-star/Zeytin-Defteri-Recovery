<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sıramı bul · Yağhane sırası</title>
<link rel="stylesheet" href="/stil.css">
<script type="module" src="/js/bul.js"></script>
</head>
<body>
<header class="marka-cubuk"><div class="marka-ic"><a class="marka" href="https://zeytindefteri.tr/" rel="noopener"><span class="isaret" aria-hidden="true">Z</span>Zeytin Defteri</a><span class="marka-alt">Yağhane sırası</span></div></header>
<main>
  <p class="fabrika">Yağhane sırası</p>
  <h1>Sıramı bul</h1>
  <form id="form" class="kart" novalidate>
    <label for="fabrika">Yağhanenin kısa adı (fişte yazar)</label>
    <input id="fabrika" autocomplete="off" autocapitalize="none" spellcheck="false">
    <label for="kod">Sıra kodu (4 hane)</label>
    <input id="kod" inputmode="numeric" maxlength="4" autocomplete="off">
    <label for="ek">Telefonunun son 2 hanesi (telefon vermediysen kasa sayısı)</label>
    <input id="ek" inputmode="numeric" maxlength="3" autocomplete="off">
    <div id="mesaj" class="hata gizli" role="alert"></div>
    <div class="dugmeler"><button class="ana" type="submit">Sıramı göster</button></div>
  </form>
  <p class="not">Kod tek başına sıranı göstermez; ikinci bilgi başkasının sıranı görmesini engeller.</p>
</main>
</body>
</html>
