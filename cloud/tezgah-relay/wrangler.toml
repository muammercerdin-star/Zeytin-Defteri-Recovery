name = "tezgah-relay"
main = "worker.js"
compatibility_date = "2026-11-01"
# Üretimde özel alan adı kullan. workers.dev yalnız geliştirme içindir.
workers_dev = false

[vars]
# Dağıtımdan önce kendi alan adlarınla değiştir. Bunlar gizli anahtar değildir.
RELAY_URL = "https://relay.zeytindefteri.com"
ALLOWED_ORIGINS = '["https://web.zeytindefteri.com"]'
CREATE_PER_MINUTE = "10"
CREATE_PER_DAY = "1000"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "TezgahRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TezgahRelay"]

[observability]
enabled = false
