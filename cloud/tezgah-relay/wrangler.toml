name = "tezgah-relay"
main = "worker.js"
compatibility_date = "2026-11-01"
# İlk deneme: workers.dev + pages.dev (Wi-Fi). Üretimde relay.zeytindefteri.com'a geçilecek.
workers_dev = true

[vars]
# Dağıtımdan önce kendi alan adlarınla değiştir. Bunlar gizli anahtar değildir.
RELAY_URL = "https://tezgah-relay.muammercerdin.workers.dev"
ALLOWED_ORIGINS = '["https://zeytin-tezgah.pages.dev"]'
CREATE_PER_MINUTE = "10"
CREATE_PER_DAY = "1000"
FRAME_RATE = "20"
FRAME_BURST = "60"
BYTES_PER_MINUTE = "4194304"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "TezgahRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TezgahRelay"]

[observability]
enabled = false
